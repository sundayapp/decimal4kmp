name: PR Agentic Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
jobs:
  review:
    if: |
      vars.ENABLE_AGENTIC_PR_REVIEW == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review') &&
        contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)))
    uses: sundayapp/reusable-workflows/.github/workflows/pr-review-template.yml@v4
    secrets:
      LITELLM_PR_REVIEWS_API_KEY: ${{ secrets.LITELLM_PR_REVIEWS_API_KEY }}
      APP_GITHUB_ID: ${{ secrets.APP_GITHUB_ID }}
      APP_GITHUB_PRIVATE_KEY: ${{ secrets.APP_GITHUB_PRIVATE_KEY }}
